name: Cr4shed
options:
  bundleIdPrefix: com.muirey03
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  SDKROOT: iphoneos
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGN_IDENTITY: ""
  TARGETED_DEVICE_FAMILY: "1,2"
  SWIFT_VERSION: "5.0"
  CLANG_ENABLE_OBJC_ARC: "YES"
  SUPPORTS_MACCATALYST: "NO"
  ONLY_ACTIVE_ARCH: "NO"
  ARCHS: "arm64 arm64e"
  VALID_ARCHS: "arm64 arm64e"
  HEADER_SEARCH_PATHS:
    - $(SRCROOT)/Sources/CCommon
    - $(SRCROOT)/Vendor/libroot/src
    - $(SRCROOT)/Include
    - $(SRCROOT)/Include/CoreSymbolication
  FRAMEWORK_SEARCH_PATHS:
    - $(SRCROOT)/Frameworks
  LIBRARY_SEARCH_PATHS:
    - $(SRCROOT)/Libraries
  OTHER_CFLAGS: "$(inherited) -DIPHONEOS_ARM64 -Wno-unguarded-availability"
  OTHER_SWIFT_FLAGS: "$(inherited) -Osize"
  GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) CR4_DEBUG_LOGGING=$(CR4_DEBUG_LOGGING)"
  SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(CR4_SWIFT_LOGGING_CONDITION)"
  CR4_DEBUG_LOGGING: "0"
  CR4_SWIFT_LOGGING_CONDITION: ""

targets:
  Cr4shedException:
    type: library.dynamic
    platform: iOS
    scheme: {}
    sources:
      - path: Sources/Exception
      - path: Sources/CCommon
      - path: Vendor/libroot/src/dyn.c
    settings:
      PRODUCT_NAME: Cr4shedException
      MACH_O_TYPE: mh_dylib
      EXECUTABLE_EXTENSION: dylib
      GENERATE_INFOPLIST_FILE: YES
      SKIP_INSTALL: YES
      OTHER_LDFLAGS: ["-framework", "Foundation", "-Wl,-ignore_auto_link_library,swiftXPC"]
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_COMPILATION_MODE: wholemodule

  Cr4shedMach:
    type: library.dynamic
    platform: iOS
    scheme: {}
    sources:
      - path: Sources/Mach
      - path: Sources/CCommon
      - path: Vendor/libroot/src/dyn.c
    settings:
      PRODUCT_NAME: Cr4shedMach
      MACH_O_TYPE: mh_dylib
      EXECUTABLE_EXTENSION: dylib
      GENERATE_INFOPLIST_FILE: YES
      SKIP_INSTALL: YES
      SWIFT_OBJC_BRIDGING_HEADER: Sources/Mach/Mach-Bridging-Header.h
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      OTHER_LDFLAGS: ["-framework", "Foundation", "-Wl,-ignore_auto_link_library,swiftXPC"]

  Cr4shedJetsam:
    type: library.dynamic
    platform: iOS
    scheme: {}
    sources:
      - path: Sources/Jetsam
      - path: Sources/CCommon
      - path: Vendor/libroot/src/dyn.c
    settings:
      PRODUCT_NAME: Cr4shedJetsam
      MACH_O_TYPE: mh_dylib
      EXECUTABLE_EXTENSION: dylib
      GENERATE_INFOPLIST_FILE: YES
      SKIP_INSTALL: YES
      SWIFT_OBJC_BRIDGING_HEADER: Sources/Jetsam/Jetsam-Bridging-Header.h
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      OTHER_LDFLAGS: ["-framework", "Foundation", "-Wl,-ignore_auto_link_library,swiftXPC"]

  cr4shedd:
    type: tool
    platform: iOS
    scheme: {}
    sources:
      - path: Sources/Daemon
      - path: Sources/CCommon
      - path: Vendor/libroot/src/dyn.c
    settings:
      PRODUCT_NAME: cr4shedd
      GENERATE_INFOPLIST_FILE: YES
      SKIP_INSTALL: YES
      SWIFT_OBJC_BRIDGING_HEADER: Sources/Daemon/Daemon-Bridging-Header.h
      LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "/usr/lib/swift", "@executable_path/Frameworks", "@executable_path/../lib"]
      OTHER_LDFLAGS: ["-framework", "Foundation", "-framework", "UserNotifications", "-Wl,-ignore_auto_link_library,swiftXPC"]

  Cr4shed:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources/App
        excludes:
          - Resources/Info.plist
      - path: Sources/CCommon
      - path: Vendor/libroot/src/dyn.c
    settings:
      PRODUCT_NAME: Cr4shed
      PRODUCT_BUNDLE_IDENTIFIER: com.muirey03.cr4shedgui
      INFOPLIST_FILE: Sources/App/Resources/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      SKIP_INSTALL: YES
      SWIFT_OBJC_BRIDGING_HEADER: Sources/App/App-Bridging-Header.h
      TARGETED_DEVICE_FAMILY: "1,2"
      OTHER_LDFLAGS: ["-framework", "Foundation", "-framework", "UIKit", "-Wl,-ignore_auto_link_library,swiftXPC"]
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
